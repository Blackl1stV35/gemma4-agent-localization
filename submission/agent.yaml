name: swe_agent
model: gemma-4-e4b-it-qat-w4a16-ct
description: Fixes bugs and implements small features in a Python repository.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_code_neighbors
  - search_similar_code
  - get_status
  - submit_patch
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
generate_content_config:
  temperature: 0.2
  top_p: 0.95
  max_output_tokens: 16384
  thinking_config:
    thinking_budget: 4096
    include_thoughts: true
